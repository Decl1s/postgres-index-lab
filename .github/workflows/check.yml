name: Я проверяю планы SQL и выпускаю исходники
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.12.15'
            mode: full
          - os: windows-2025
            python: '3.12.10'
            mode: unit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Я проверяю свойство результата, план, отказы и архив
        run: python scripts/ci.py --mode ${{ matrix.mode }}
  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Decl1s/postgres-index-lab'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Я публикую только разрешённые исходники и SHA256
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py
